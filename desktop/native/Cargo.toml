[package]
name = "gamecon-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Нативне ядро програми GameCon для ПК (Flutter через dart:ffi): гра на передньому плані."

[lib]
crate-type = ["cdylib"]

[dependencies]
gamecon-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
