# Edge-вузол GameCon (окремий сервер, напр. Oracle Cloud): одне ім'я на дві ролі.
#   /rtc, /twirp          → LiveKit (сигналінг голосу; звук іде напряму по UDP/TCP/TURN)
#   /build, /storage, …   → кешуючий проксі до сайту (CDN): файли беруться з __ORIGIN__ і лежать на диску вузла
# Шаблон: __HOST__, __ORIGIN__, __CERT__, __CACHE_GB__ підставляє deploy/edge/setup-edge.sh.

proxy_cache_path /var/cache/gamecon-edge levels=1:2 keys_zone=gc_edge:200m
                 max_size=__CACHE_GB__g inactive=30d use_temp_path=off;

map $request_method $gc_edge_method_ok {
    default 0;
    GET     1;
    HEAD    1;
    OPTIONS 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://__HOST__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;

    ssl_certificate     __CERT__/fullchain.pem;
    ssl_certificate_key __CERT__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;

    # Перевірка вузла (сайт і моніторинг).
    location = /edge-health {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 "ok\n";
    }

    # ---------- LiveKit ----------
    location ~ ^/(rtc|twirp)(/|$) {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- CDN ----------
    # Лише публічні файли: збірка (імена з хешем), завантаження користувачів, статичні картинки.
    location ~ ^/(build|storage|images|fonts|stickers)/ {
        if ($gc_edge_method_ok = 0) { return 405; }
        # Модульні скрипти Vite, шрифти й canvas (редактор фото, колір обкладинки) читаються через CORS.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header X-Edge-Cache $upstream_cache_status always;
        if ($request_method = OPTIONS) { return 204; }

        # Великі відео й аудіо — шматками по 4 МБ: перемотування не тягне весь файл з сайту.
        slice 4m;
        proxy_cache gc_edge;
        proxy_cache_key $uri$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # До сайту — без кук і без авторизації: кешуємо тільки публічне.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;

        proxy_pass https://__ORIGIN__;
        proxy_ssl_server_name on;
        proxy_set_header Host __ORIGIN__;
        proxy_set_header X-GameCon-Edge "1";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Усе інше — на сайт (вузол не відповідає замість нього).
    location / {
        return 302 https://__ORIGIN__$request_uri;
    }
}
