# Голосові кімнати: WebSocket сигналінгу LiveKit. Звук іде напряму по UDP (50000–60000) або TCP 7881.
# Шаблон: __VOICE__ і __CERT__ підставляє deploy/livekit/setup-livekit.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __VOICE__;
    return 301 https://__VOICE__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __VOICE__;

    ssl_certificate     __CERT__/fullchain.pem;
    ssl_certificate_key __CERT__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
