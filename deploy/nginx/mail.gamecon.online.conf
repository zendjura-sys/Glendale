# Веб-пошта Roundcube (deploy/mail/setup-inbound.sh підставляє __…__ і кладе файл у sites-enabled).
# Окремий піддомен: cookie й сесії пошти не перетинаються з соцмережею.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __MAILHOST__;

    ssl_certificate     __CERT__/fullchain.pem;
    ssl_certificate_key __CERT__/privkey.pem;

    # Назовні — лише public_html релізу; конфіг, база, журнали й код лежать поза ним.
    root /opt/roundcube/public_html;
    index index.php;
    client_max_body_size 30m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\. {
        deny all;
    }
    location = /installer.php {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # static.php/skins/… — стилі й скрипти з каталогів поза public_html (PATH_INFO).
    location ~ ^/(index|static)\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }
    location ~ \.php$ {
        deny all;
    }
}
