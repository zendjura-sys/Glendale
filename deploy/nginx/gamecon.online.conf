# Захист від флуду (DDoS на рівні застосунку): запити й з’єднання з однієї IP-адреси.
# Від масованих атак на канал це не рятує — для них потрібен Cloudflare чи захист у хостера.
limit_req_zone $binary_remote_addr zone=gc_req:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gc_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=gc_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gamecon.online www.gamecon.online *.gamecon.online;
    return 301 https://gamecon.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gamecon.online *.gamecon.online;

    ssl_certificate     /etc/letsencrypt/live/gamecon.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamecon.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://gamecon.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamecon.online;

    ssl_certificate     /etc/letsencrypt/live/gamecon.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamecon.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gamecon_ssl:10m;

    root /var/www/gamecon/public;
    index index.php;
    charset utf-8;

    # Музика до 30 МБ, файли в повідомленнях до 50 МБ.
    client_max_body_size 72m;

    # Повільні клієнти (slowloris) не тримають з’єднання годинами; ліміти — відповідь 429.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn gc_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    # Відповіді Laravel за проксі (CDN) теж стискаємо.
    gzip_proxied any;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/manifest+json application/xml application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Статичні картинки сайту (значки Google Play тощо): імена без хешу, тож тиждень, а не рік.
    location /images/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Laravel Reverb (WebSocket + HTTP API для трансляцій).
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # «Увійти через застосунок»: браузер опитує стан запиту кожні 2 с — без суворого ліміту входу
    # (ліміти — у Laravel: 6 запитів на вхід і 90 опитувань на хвилину з адреси).
    location ^~ /login/app/ {
        try_files $uri /index.php?$query_string;
    }

    # Вхід, реєстрація, відновлення пароля — суворіше: 10 запитів на хвилину з адреси.
    location ~ ^/(login|register|forgot-password|reset-password|two-factor-challenge)(/|$) {
        limit_req zone=gc_auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        limit_req zone=gc_req burst=80 nodelay;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
