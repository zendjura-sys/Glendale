# nginx vhost for Glendale with HTTPS. install.sh writes it to /etc/nginx/sites-available/<domain>
# (replacing social.monsory.net with DOMAIN). The certificate is issued with `certbot certonly`, so certbot
# never edits nginx configs: with a *.domain wildcard site on the same server it would pick the wrong file.

map $http_upgrade $glendale_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name social.monsory.net;

    # Let's Encrypt HTTP-01 challenges (certbot certonly --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name social.monsory.net;

    ssl_certificate     /etc/letsencrypt/live/social.monsory.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.monsory.net/privkey.pem;

    # Audio uploads are up to 50 MB.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Realtime (messages, typing, online status).
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $glendale_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}
