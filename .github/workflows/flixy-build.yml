name: Flixy (кіно) — Build Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'mobile-flixy/**'
      - '.github/workflows/flixy-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Проєкт живе в zendjura-sys/Glendale. У форках і копіях job пропускається.
    if: github.repository == 'zendjura-sys/Glendale'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flixy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json — секрет Firebase-проєкту GameConnect, у git
      # не потрапляє (див. mobile-flixy/.gitignore). Якщо секрет заведений
      # у репозиторії — Firebase-функції (аналітика/краш-репорти/push)
      # увімкнені; без нього build.gradle сам пропускає ці плагіни й APK
      # все одно збирається.
      - name: Decode google-services.json (якщо секрет заведено)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FLIXY_GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Дебаг-збірка (авто-підпис дебаг-ключем) — підтверджує, що проєкт
      # компілюється після кожної зміни. Реліз під бойовим підписом (flixy.jks)
      # робиться на боці розробника вручну, поки не заведено секрети підпису.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: flixy-debug-apk
          path: mobile-flixy/app/build/outputs/apk/debug/*.apk
          retention-days: 30
