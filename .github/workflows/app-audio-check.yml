# Фонова музика застосунку на емуляторі Android (release-збірка, як у користувачів):
# трек грає → застосунок згортається → foreground-сервіс, медіасесія й сповіщення мають жити.
name: App background audio

on:
  workflow_dispatch:
  push:
    paths:
      - mobile/lib/audio.dart
      - mobile/lib/state.dart
      - mobile/lib/main.dart
      - mobile/android/**
      - mobile/pubspec.yaml
      - mobile/tool/audio_check.sh
      - .github/workflows/app-audio-check.yml

concurrency:
  group: app-audio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    if: github.repository == 'zendjura-sys/Glendale'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Release APK з тестовим треком
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --dart-define=GC_AUDIO_TEST_URL=https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3

      - name: KVM для емулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/tool/audio_check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-check
          path: audio-check/
          retention-days: 7
