# Збірка GameCon для Windows (desktop/, Electron) у GitHub Actions — №261.
#
# Коли запускається: push зі змінами в desktop/ або цьому файлі; вручну — Actions → «Desktop build».
# Результат: артефакт «gamecon-desktop-<версія>» з інсталятором GameCon-Setup-<версія>.exe.
# Підпис коду не налаштовано: SmartScreen попередить при першому запуску.
name: Desktop build

on:
  push:
    paths:
      - desktop/**
      - .github/workflows/desktop-build.yml
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'zendjura-sys/Glendale'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Версія
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gamecon-desktop-${{ steps.version.outputs.v }}
          path: desktop/dist/*.exe
          retention-days: 30
