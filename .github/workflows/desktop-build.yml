# Збірка GameCon для Windows (desktop/, Rust + Tauri 2) у GitHub Actions — №261.
#
# Коли запускається: push зі змінами в desktop/ або цьому файлі; вручну — Actions → «Desktop build».
# Результат: артефакт «gamecon-desktop» з інсталятором NSIS (*-setup.exe).
# Підпис коду не налаштовано: SmartScreen попередить при першому запуску.
name: Desktop build

on:
  push:
    paths:
      - desktop/**
      - .github/workflows/desktop-build.yml
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'zendjura-sys/Glendale'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/**/Cargo.toml') }}
      - name: Тести логіки
        run: cargo test -p gamecon-core
      - name: Інсталятор
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.1.0 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: gamecon-desktop
          path: desktop/target/release/bundle/nsis/*.exe
          retention-days: 30
