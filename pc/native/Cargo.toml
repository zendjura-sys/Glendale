[package]
name = "gamecon-pc-core"
version = "1.2611.0"
edition = "2021"
license = "UNLICENSED"
description = "Нативне ядро GameCon для ПК (Rust → Electron Main через NAPI-RS): стан, геометрія вікон, хоткеї."

# Окремий від desktop/ (Tauri) — власний workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
